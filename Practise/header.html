<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Header</title>

<style>

    body{

        margin: 0;
        padding: 0;
    }

    .header {
        display: flex;
        justify-content: space-between;
        border-bottom: 2px solid teal;
        height: 100px;
    }


    .Logo{
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding-left: 20px;
    }

    .logo_image {
        height: 40px;
        width: 40px;
        border-radius: 100%;
    }

    .navbar{
        /* background-color: yellow; */
        display: flex;
        align-items: center;
        /* flex-grow: 1;
        text-align: center; */
    }

    .navlist{
        list-style: none;
        display: flex;
        gap: 20px;
    }

    .nav-link{
        text-decoration: none;
        color: black;
        font-weight: 600px;
        font-size: 18px;

        &:hover{
            text-decoration: underline;
        }
    }

    .actions{
        padding: 12px 24px;
        /* background-color: blue; */

        align-items: center;
        display: flex;
        gap: 12px;
    }

    .btn{

        padding: 12px;
        background-color: teal;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;

    }

    .btn:hover {
    background-color: rgb(48, 203, 208);  
    color: black; 
   }

</style>

</head>
