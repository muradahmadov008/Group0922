<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampa Layihəsi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>JavaScript Nə Edə Bilər?</h1>
        <p id="demo">JavaScript HTML atributlarının dəyərini dəyişə bilir.</p>

        <div class="light-box">
            <img id="myImage" src="https://www.w3schools.com/js/pic_bulboff.gif" width="100">
        </div>

        <div class="btn-group">
            <button class="btn on" onclick="turnOn()">Yandır</button>
            <button class="btn off" onclick="turnOff()">Söndür</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
